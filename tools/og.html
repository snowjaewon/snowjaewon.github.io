<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800&family=IBM+Plex+Mono:wght@400&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden; position: relative;
    background-color: #f7f7f4;
    background-image:
      linear-gradient(rgba(220, 223, 216, .6) 1px, transparent 1px),
      linear-gradient(90deg, rgba(220, 223, 216, .6) 1px, transparent 1px);
    background-size: 56px 56px;
    color: #20262e;
    font-family: "Outfit", "Pretendard Variable", "Pretendard", sans-serif;
    word-break: keep-all;
  }
  .brand { position: absolute; left: 72px; top: 64px; display: flex; align-items: center; gap: 18px; font-size: 30px; font-weight: 800; }
  h1 { position: absolute; left: 72px; top: 196px; margin: 0; font-size: 112px; font-weight: 800; line-height: 1.02; letter-spacing: -0.05em; }
  .lead { position: absolute; left: 72px; top: 440px; margin: 0; font-size: 30px; color: #3a424c; }
  .stamp { position: absolute; right: 70px; top: 150px; width: 270px; transform: rotate(-6deg); }
  .foot { position: absolute; left: 72px; right: 72px; bottom: 58px; display: flex; justify-content: space-between; font-family: "IBM Plex Mono", "Pretendard Variable", monospace; font-size: 20px; color: #697077; }
</style>
</head>
<body>
  <div class="brand"><img src="../assets/seal.svg" width="60" height="60" alt="">재원 랩</div>
  <h1>돌아가는<br>것들의 기록</h1>
  <p class="lead">시스템을 만들고, 숫자로 검증합니다</p>
  <img class="stamp" src="../assets/seal-stamp.svg" alt="">
  <div class="foot"><span>설재원 · 전남대학교 에너지자원공학과</span><span>snowjaewon.github.io</span></div>
</body>
</html>
